<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Reviver — Azure Service Bus DLQ tool</title>
  <desc>A terminal prompt symbol with an EKG heartbeat line emerging from it, paired with the Reviver wordmark.</desc>

  <defs>
    <mask id="ekg-mask" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="680" height="280" fill="white"/>
      <rect x="18"  y="21"  width="55"  height="54" fill="black" rx="2"/>
      <rect x="286" y="104" width="216" height="84"  fill="black" rx="2"/>
      <rect x="288" y="185" width="212" height="21"  fill="black" rx="2"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="680" height="280" rx="16" fill="#111827"/>

  <!-- Terminal icon -->
  <g transform="translate(110, 90)">
    <rect x="0" y="0" width="140" height="100" rx="16" fill="#0FB57F"/>
    <text x="22" y="62" font-family="ui-monospace, monospace" font-size="42" font-weight="500" fill="#0a2a1f">&gt;_</text>
    <path d="M 70 50 L 85 50 L 92 30 L 105 80 L 115 40 L 125 50 L 140 50"
          stroke="#FFD23F" stroke-width="5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          transform="translate(-5,0)"
          mask="url(#ekg-mask)"/>
  </g>

  <!-- Wordmark -->
  <text x="290" y="170"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="64" font-weight="500" fill="#faf9f5" letter-spacing="-1">reviver</text>
  <text x="292" y="200"
        font-family="ui-monospace, monospace"
        font-size="14" font-weight="400" fill="#c2c0b6" letter-spacing="2">$ revive --everything</text>
</svg>
